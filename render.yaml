databases:
  - name: nwcinema-db
    plan: free
    databaseName: nwcinema
    user: nw

services:
  - type: web
    name: nw-cinema
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nwcinema-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "8845148579"
      - key: WEBHOOK_SECRET
        generateValue: true
